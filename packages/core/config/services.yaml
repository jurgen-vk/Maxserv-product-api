parameters: { }

services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  # ==========================================================================
  # Autodiscovery
  # ==========================================================================

  MaxServ\Core\:
    resource: '../src/*'

  Symfony\Component\Finder\:
    resource: '../../../vendor/symfony/finder/*'

  Symfony\Component\Routing\:
    resource: '../../../vendor/symfony/routing/*'

  Symfony\Component\Config\:
    resource: '../../../vendor/symfony/config/*'

  Symfony\Component\Filesystem\:
    resource: '../../../vendor/symfony/filesystem/*'

  logger:
    synthetic: true

  # ==========================================================================
  # Routing
  # ==========================================================================

  Symfony\Component\Config\FileLocator:
    arguments:
      - [ '%application.root%' ]

  Symfony\Component\Routing\Loader\YamlFileLoader:
    arguments:
      $locator: '@Symfony\Component\Config\FileLocator'

  MaxServ\Core\Routing\AttributeRouteLoader: ~

  Symfony\Component\Routing\Loader\AttributeClassLoader: '@MaxServ\Core\Routing\AttributeRouteLoader'

  Symfony\Component\Routing\Loader\AttributeDirectoryLoader: ~

  MaxServ\Core\Routing\RouteLoader: ~

  app.router:
    class: Symfony\Component\Routing\Router
    arguments:
      $loader: '@MaxServ\Core\Routing\RouteLoader'
      $resource: 'routes'
      $context: '@Symfony\Component\Routing\RequestContext'
      $options:
        cache_dir: '%application.root%/var/cache/routing'
        debug: '%app.is_dev%'

  MaxServ\Core\Routing\Router:
    public: true
    arguments:
      $container: '@service_container'
      $router: '@app.router'

  MaxServ\Core\Routing\RouteCacher:
    arguments:
      $router: '@app.router'

  Symfony\Bridge\Twig\Extension\RoutingExtension:
    arguments:
      $generator: '@app.router'

  # ==========================================================================
  # Database
  # ==========================================================================

  MaxServ\Core\Database\Connection:
    arguments:
      $host: '%db.host%'
      $user: '%db.user%'
      $password: '%db.password%'
      $database: '%db.database%'

  # ==========================================================================
  # Session
  # ==========================================================================

  Symfony\Component\HttpFoundation\Session\Storage\NativeSessionStorage: ~

  Symfony\Component\HttpFoundation\Session\Session: ~

  Symfony\Component\HttpFoundation\RequestStack: ~

  MaxServ\Core\Http\Request\RequestFactory:
    public: true

  # ==========================================================================
  # Twig
  # ==========================================================================

  Twig\Loader\FilesystemLoader:
    class: 'MaxServ\Core\FileSystem\TwigFileSystemLoader'
    arguments: [ ]

  Symfony\Bridge\Twig\AppVariable:
    calls:
      - method: setRequestStack
        arguments: [ '@Symfony\Component\HttpFoundation\RequestStack' ]
      - method: setDebug
        arguments: [ '%app.is_dev%' ]

  Twig\Environment:
    class: 'Twig\Environment'
    arguments:
      - '@Twig\Loader\FilesystemLoader'
      - cache: '%application.root%/var/cache/twig'
        auto_reload: '%app.is_dev%'
        strict_variables: '%app.is_dev%'
    calls:
      - method: addExtension
        arguments: [ '@UserFrosting\ViteTwig\ViteTwigExtension' ]
      - method: addExtension
        arguments: [ '@MaxServ\Core\Twig\Extension\ViteAssetExtension' ]
      - method: addExtension
        arguments: [ '@Symfony\Component\Mercure\Twig\MercureExtension' ]
      - method: addExtension
        arguments: [ '@MaxServ\Core\Twig\Extension\IconExtension' ]
      - method: addExtension
        arguments: [ '@MaxServ\Core\Twig\Extension\AttributeExtension' ]
      - method: addExtension
        arguments: [ '@Symfony\Bridge\Twig\Extension\RoutingExtension' ]
      - method: addGlobal
        arguments: [ 'app', '@Symfony\Bridge\Twig\AppVariable' ]
      - method: addGlobal
        arguments: [ 'notifications', '@MaxServ\Core\Notification\Notifications' ]
      - method: addGlobal
        arguments: [ 'timezone', '@MaxServ\Core\Time\Timezone' ]

  # ==========================================================================
  # Vite
  # ==========================================================================

  UserFrosting\ViteTwig\ViteManifest:
    arguments:
      $manifestPath: '%application.root%/public/assets/.vite/manifest.json'
      $basePath: '/assets/'
      $serverUrl: '%vite.server_url%'
      $devEnabled: '%app.is_dev%'

  UserFrosting\ViteTwig\ViteTwigExtension:
    arguments:
      $manifest: '@UserFrosting\ViteTwig\ViteManifest'

  MaxServ\Core\Twig\Resolver\ViteAssetResolver:
    arguments:
      $package: '@Symfony\Component\Asset\PackageInterface'
      $basePath: '%vite.base_path%'
      $serverUrl: '%vite.server_url%'
      $devEnabled: '%app.is_dev%'

  # ==========================================================================
  # Assets
  # ==========================================================================

  Symfony\Component\Asset\VersionStrategy\EmptyVersionStrategy: ~

  Symfony\Component\Asset\UrlPackage:
    arguments:
      - '%app.url%'
      - '@Symfony\Component\Asset\VersionStrategy\EmptyVersionStrategy'

  Symfony\Component\Asset\PackageInterface: '@Symfony\Component\Asset\UrlPackage'

  # ==========================================================================
  # Mercure
  # ==========================================================================

  Symfony\Component\Mercure\Jwt\StaticTokenProvider:
    arguments:
      - '%mercure.publisher_jwt%'

  Symfony\Component\Mercure\HubInterface:
    class: Symfony\Component\Mercure\Hub
    arguments:
      - '%mercure.hub_url%'
      - '@Symfony\Component\Mercure\Jwt\StaticTokenProvider'
      - null
      - '%mercure.public_url%'

  # Decorates the Hub above so anything still typing plain HubInterface gets safe
  # publishing as a fallback — new code should inject SafeHub directly instead, to
  # get access to publishSafely().
  MaxServ\Core\Mercure\SafeHub:
    decorates: Symfony\Component\Mercure\HubInterface
    arguments: [ '@.inner' ]

  Symfony\Component\Mercure\HubRegistry:
    arguments:
      - '@Symfony\Component\Mercure\HubInterface'

  Symfony\Component\Mercure\Twig\MercureExtension:
    arguments:
      - '@Symfony\Component\Mercure\HubRegistry'

  # ==========================================================================
  # Console
  # ==========================================================================

  Symfony\Component\Console\Application:
    public: true
    calls:
      - method: setCommandLoader
        arguments: [ '@console.command_loader' ]

  # ==========================================================================
  # Cache
  # ==========================================================================

  MaxServ\Core\Container\ContainerCacher:
    arguments:
      $debug: '%app.is_dev%'

  MaxServ\Core\Cache\Command\CacheWarmupCommand:
    arguments:
      $cacheables: !tagged_iterator app.cacheable

  MaxServ\Core\Cache\Command\CacheClearCommand:
    arguments:
      $cacheables: !tagged_iterator app.cacheable

  # ==========================================================================
  # Error rendering
  # ==========================================================================

  MaxServ\Core\Twig\ErrorRenderer:
    arguments:
      $renderers: !tagged_iterator core.error_renderer
      $debug: '%app.debug%'

  # ==========================================================================
  # Event
  # ==========================================================================

  event_dispatcher:
    class: Symfony\Component\EventDispatcher\EventDispatcher
    public: true

  Symfony\Contracts\EventDispatcher\EventDispatcherInterface: '@event_dispatcher'

  # ==========================================================================
  # Messenger
  # ==========================================================================

  MaxServ\Core\Messenger\DatabaseTransportFactory:
    arguments:
      $host: '%db.host%'
      $user: '%db.user%'
      $password: '%db.password%'
      $database: '%db.database%'
      $serializer: '@messenger.transport.serializer'
      $tableName: 'messenger_messages'
      $autoSetup: false

  messenger.transport.serializer:
    class: Symfony\Component\Messenger\Transport\Serialization\Serializer
    arguments:
      $serializer: '@messenger.transport.symfony_serializer'

  messenger.transport.symfony_serializer:
    class: Symfony\Component\Serializer\Serializer
    arguments:
      $normalizers:
        - !service { class: Symfony\Component\Serializer\Normalizer\BackedEnumNormalizer }
        - !service { class: Symfony\Component\Serializer\Normalizer\DateTimeNormalizer }
        - !service { class: Symfony\Component\Serializer\Normalizer\ArrayDenormalizer }
        - !service
          class: Symfony\Component\Serializer\Normalizer\ObjectNormalizer
          arguments:
            $propertyTypeExtractor: '@Symfony\Component\PropertyInfo\Extractor\ReflectionExtractor'
      $encoders:
        - !service { class: Symfony\Component\Serializer\Encoder\JsonEncoder }
        - !service { class: Symfony\Component\Serializer\Encoder\XmlEncoder }

  Symfony\Component\PropertyInfo\Extractor\ReflectionExtractor: ~

  messenger.receiver_locator:
    class: Symfony\Component\DependencyInjection\ServiceLocator
    arguments:
      - [ ]
    tags: [ 'container.service_locator' ]

  messenger.senders_locator:
    class: Symfony\Component\Messenger\Transport\Sender\SendersLocator
    arguments:
      $sendersMap: [ ]
      $sendersLocator: '@messenger.receiver_locator'

  Symfony\Component\Messenger\Middleware\AddBusNameStampMiddleware:
    arguments:
      $busName: 'messenger.bus.default'

  Symfony\Component\Messenger\Middleware\SendMessageMiddleware:
    arguments:
      $sendersLocator: '@messenger.senders_locator'
      $eventDispatcher: '@event_dispatcher'

  messenger.bus.default.middleware.handle_message:
    class: Symfony\Component\Messenger\Middleware\HandleMessageMiddleware
    arguments:
      - ~

  messenger.bus.default:
    class: Symfony\Component\Messenger\MessageBus
    public: true
    tags: [ 'messenger.bus' ]
    arguments:
      $middlewareHandlers:
        - '@Symfony\Component\Messenger\Middleware\AddBusNameStampMiddleware'
        - '@Symfony\Component\Messenger\Middleware\SendMessageMiddleware'
        - '@messenger.bus.default.middleware.handle_message'

  Symfony\Component\Messenger\MessageBusInterface: '@messenger.bus.default'

  messenger.routable_message_bus:
    class: Symfony\Component\Messenger\RoutableMessageBus
    arguments:
      - ~
      - '@messenger.bus.default'

  console.command.messenger_consume_messages:
    class: Symfony\Component\Messenger\Command\ConsumeMessagesCommand
    arguments:
      - '@messenger.routable_message_bus'
      - '@messenger.receiver_locator'
      - '@event_dispatcher'
      - ~
      - [ ]
      - ~
      - [ ]

  console.command.messenger_setup_transports:
    class: Symfony\Component\Messenger\Command\SetupTransportsCommand
    arguments:
      - '@messenger.receiver_locator'
      - [ ]

  Symfony\Component\Messenger\EventListener\SendFailedMessageForRetryListener:
    arguments:
      $sendersLocator: '@messenger.receiver_locator'
      $retryStrategyLocator: !tagged_locator
        tag: 'app.messenger.retry_strategy'
        index_by: 'transport'
      $eventDispatcher: '@event_dispatcher'

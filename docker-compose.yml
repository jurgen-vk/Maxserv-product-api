services:
  db:
    image: mysql:8.0.35
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      start_period: 20s
      interval: 2s
      timeout: 5s
      retries: 5
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin:5.2.1-apache
    restart: always
    ports:
      - "8081:80"
    environment:
      - PMA_ARBITRARY=1
      - PMA_HOST=db
      - PMA_PORT=3306
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: migrate
    command: ["php", "bin/console", "migrate:init"]
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}
      APP_DEBUG: ${APP_DEBUG}
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: app
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}
      MERCURE_HUB_URL: ${MERCURE_HUB_URL}
      MERCURE_PUBLIC_URL: ${MERCURE_PUBLIC_URL}
      MERCURE_PUBLISHER_JWT: ${MERCURE_PUBLISHER_JWT}
      APP_DEBUG: ${APP_DEBUG}
      APP_ENV: ${APP_ENV:-dev}
      APP_URL: ${APP_URL}
      VITE_SERVER_URL: ${VITE_SERVER_URL}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  app-proxy:
    image: caddy:2-alpine
    container_name: app-proxy
    restart: always
    environment:
      APP_SERVER_NAME: ${APP_SERVER_NAME}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports:
      - "443:443"
    depends_on:
      - app
  messenger-imports:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: messenger-imports
    restart: always
    command: ["sh", "-c", "php bin/console import:clear-stuck && php bin/console messenger:consume imports --keepalive=300"]
    environment:
      DB_HOST: db
      DB_USER: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      DB_DATABASE: ${MYSQL_DATABASE}
      MERCURE_HUB_URL: ${MERCURE_HUB_URL}
      MERCURE_PUBLISHER_JWT: ${MERCURE_PUBLISHER_JWT}
      APP_DEBUG: ${APP_DEBUG}
      APP_ENV: ${APP_ENV:-dev}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
  mercure:
    image: dunglas/mercure
    container_name: mercure
    restart: always
    environment:
      SERVER_NAME: ${MERCURE_SERVER_NAME}
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY}
      MERCURE_EXTRA_DIRECTIVES: |
        anonymous
        cors_origins ${APP_URL}
      CADDY_SERVER_EXTRA_DIRECTIVES: tls ${ACME_EMAIL}
      GLOBAL_OPTIONS: auto_https disable_redirects
      CADDY_EXTRA_CONFIG: |
        :80 {
        	mercure {
        		publisher_jwt {env.MERCURE_PUBLISHER_JWT_KEY} {env.MERCURE_PUBLISHER_JWT_ALG}
        		subscriber_jwt {env.MERCURE_SUBSCRIBER_JWT_KEY} {env.MERCURE_SUBSCRIBER_JWT_ALG}
        	}
        }
    ports:
      - "${MERCURE_PORT:-3443}:443"
    volumes:
      - mercure_data:/data
volumes:
  mysql_data:
  mercure_data:
  caddy_data:
